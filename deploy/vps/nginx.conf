# Convite da Sofia na VPS: Nginx servindo o build estático (pasta dist/), atrás do proxy da VPS,
# que faz o HTTPS. Montar como /etc/nginx/conf.d/default.conf num container nginx:alpine.
# Equivale ao public/_headers (que só a Netlify/Cloudflare leem). A Content-Security-Policy já vem
# no index.html (meta), não precisa ser repetida aqui.
#
# Os arquivos ficam em /srv/convite/current, um link para releases/<data> (o script
# scripts/deploy-vps.mjs envia cada versão numa pasta nova e troca o link de uma vez).

# Cache por caminho. Num `map` (contexto http) para os add_header ficarem todos no server:
# um add_header dentro de location apagaria os de segurança daquela location.
map $uri $convite_cache {
    ~^/assets/      "public, max-age=31536000, immutable";
    ~^/fotos/       "public, max-age=604800";
    ~^/presentes/   "public, max-age=86400";
    default         "no-cache";
}

server {
    listen 80;
    server_name _;
    root /srv/convite/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control $convite_cache;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # O site é uma página só (rotas por ?parâmetro); caminho inexistente é 404 de verdade.
    location / {
        try_files $uri $uri/ =404;
    }

    # Fotos da galeria em AVIF: o mime.types de versões mais antigas do Nginx não conhece o tipo.
    location ~* \.avif$ {
        default_type image/avif;
        try_files $uri =404;
    }

    # Arquivo de cabeçalhos da Netlify e arquivos ocultos não são servidos.
    location = /_headers { return 404; }
    location ~ /\. { return 404; }
}
